[project]
name = "openship-api"
version = "0.1.0"
description = "OpenShip backend API server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    "openai>=1.10.0",
    "httpx>=0.26.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.2.0",
    "pre-commit>=3.6.0",
]
