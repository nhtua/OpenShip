[project]
name = "openship-cli"
version = "0.1.0"
description = "OpenShip CLI interface"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pytest>=9.1.1",
]

[project.scripts]
openship = "src.main:app"

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
