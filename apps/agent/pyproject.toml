dependencies = [
    "fastapi>=0.115.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]
