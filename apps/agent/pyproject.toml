[project]
name = "openship-agent"
version = "0.1.0"
description = "OpenShip agent backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=3.0.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[tool.ruff]
# BLE001: Blind exception catching is intentional in API error handlers
# TRY401: logging.exception already includes the traceback
ignore = ["BLE001", "TRY401"]
