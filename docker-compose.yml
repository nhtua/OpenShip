version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: openship
      POSTGRES_USER: openship
      POSTGRES_PASSWORD: openship
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://openship:openship@postgres:5432/openship
    depends_on:
      - postgres

  web:
    build: ./apps/web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
