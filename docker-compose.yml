version: '3.8'
name: openship
# This root stack is loopback-only development packaging. Do not use its seeded
# database credentials in the standalone production stack.
services:
  migrate:
    build: ./apps/api
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://openship:openship@postgres:5432/openship
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: openship
      POSTGRES_USER: openship
      POSTGRES_PASSWORD: openship
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openship"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: docker.io/library/nats:2.15.1@sha256:023a08c46caa5aff878fb86841187bebfdad9a6e3c552ba5c1a1e18938bbf88a
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
    volumes:
      - "${OPENSHIP_MESSAGING_DIR:-.openship/messaging/dev}/server.compose.json:/etc/nats/nats.conf:ro"
      - natsdata:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

  api:
    build: ./apps/api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://openship:openship@postgres:5432/openship
      NATS_SERVERS: nats://nats:4222
      NATS_AUTH_FILE: /run/nats-auth/api.json
      NATS_TLS_CA_FILE:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      EVENT_RETENTION_DAYS: 30
      CHECKPOINT_RETENTION_DAYS: 30
      LOG_RETENTION_DAYS: 7
      CONNECTOR_INSTALLATION_ID:
      CONNECTOR_OPERATOR_USER_ID:
      ARTIFACT_ROOT: /var/lib/openship/artifacts
      ARTIFACT_STORAGE_ID: ${ARTIFACT_STORAGE_ID:?Set a stable ARTIFACT_STORAGE_ID in the root .env file}
      ARTIFACT_CONVERSATION_QUOTA_BYTES: ${ARTIFACT_CONVERSATION_QUOTA_BYTES:-134217728}
      ARTIFACT_CONVERSATION_QUOTA_COUNT: ${ARTIFACT_CONVERSATION_QUOTA_COUNT:-100}
      ARTIFACT_PROJECT_QUOTA_BYTES: ${ARTIFACT_PROJECT_QUOTA_BYTES:-1073741824}
      ARTIFACT_PROJECT_QUOTA_COUNT: ${ARTIFACT_PROJECT_QUOTA_COUNT:-1000}
      TOOL_ENABLED_IDS:
      # Profile configuration is non-secret and shared: the worker executes a
      # run the API queued, so a profile that means different things to the
      # two of them would make "which model answered" a question with two
      # answers. Only credential values come from the environment.
      MODEL_PROFILES_JSON: ${MODEL_PROFILES_JSON:-}
      MODEL_DEFAULT_PROFILE_ID: ${MODEL_DEFAULT_PROFILE_ID:-}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-4000}
      WORKFLOW_RUN_TIMEOUT_SECONDS: ${WORKFLOW_RUN_TIMEOUT_SECONDS:-1800}
      MODEL_CONTEXT_TOKENS: ${MODEL_CONTEXT_TOKENS:-128000}
      MODEL_MAX_CONTEXT_BYTES: ${MODEL_MAX_CONTEXT_BYTES:-2097152}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - artifactdata:/var/lib/openship/artifacts
      - ./secrets:/run/secrets:ro
      - "${OPENSHIP_MESSAGING_DIR:-.openship/messaging/dev}/api.json:/run/nats-auth/api.json:ro"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      messaging-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

  worker:
    build: ./apps/api
    command: ["uv", "run", "python", "-m", "src.openship.runs.worker", "--log-level", "INFO"]
    environment:
      DATABASE_URL: postgresql://openship:openship@postgres:5432/openship
      NATS_SERVERS: nats://nats:4222
      NATS_AUTH_FILE: /run/nats-auth/worker.json
      NATS_TLS_CA_FILE:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      EVENT_RETENTION_DAYS: 30
      CHECKPOINT_RETENTION_DAYS: 30
      LOG_RETENTION_DAYS: 7
      CONNECTOR_INSTALLATION_ID:
      CONNECTOR_OPERATOR_USER_ID:
      ARTIFACT_ROOT: /var/lib/openship/artifacts
      ARTIFACT_STORAGE_ID: ${ARTIFACT_STORAGE_ID:?Set a stable ARTIFACT_STORAGE_ID in the root .env file}
      ARTIFACT_CONVERSATION_QUOTA_BYTES: ${ARTIFACT_CONVERSATION_QUOTA_BYTES:-134217728}
      ARTIFACT_CONVERSATION_QUOTA_COUNT: ${ARTIFACT_CONVERSATION_QUOTA_COUNT:-100}
      ARTIFACT_PROJECT_QUOTA_BYTES: ${ARTIFACT_PROJECT_QUOTA_BYTES:-1073741824}
      ARTIFACT_PROJECT_QUOTA_COUNT: ${ARTIFACT_PROJECT_QUOTA_COUNT:-1000}
      TOOL_ENABLED_IDS:
      # Identical to the api service above, on the same variables: the worker
      # executes what the API queued, so the profile a run names has to mean
      # the same thing to both.
      MODEL_PROFILES_JSON: ${MODEL_PROFILES_JSON:-}
      MODEL_DEFAULT_PROFILE_ID: ${MODEL_DEFAULT_PROFILE_ID:-}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-4000}
      WORKFLOW_RUN_TIMEOUT_SECONDS: ${WORKFLOW_RUN_TIMEOUT_SECONDS:-1800}
      MODEL_CONTEXT_TOKENS: ${MODEL_CONTEXT_TOKENS:-128000}
      MODEL_MAX_CONTEXT_BYTES: ${MODEL_MAX_CONTEXT_BYTES:-2097152}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - artifactdata:/var/lib/openship/artifacts
      - ./secrets:/run/secrets:ro
      - "${OPENSHIP_MESSAGING_DIR:-.openship/messaging/dev}/worker.json:/run/nats-auth/worker.json:ro"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      messaging-bootstrap:
        condition: service_completed_successfully
    stop_grace_period: 3900s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

  relay:
    build: ./apps/api
    command: ["uv", "run", "python", "-m", "src.openship.messaging.relay"]
    environment:
      DATABASE_URL: postgresql://openship:openship@postgres:5432/openship
      NATS_SERVERS: nats://nats:4222
      NATS_AUTH_FILE: /run/nats-auth/relay.json
      NATS_TLS_CA_FILE:
    volumes:
      - "${OPENSHIP_MESSAGING_DIR:-.openship/messaging/dev}/relay.json:/run/nats-auth/relay.json:ro"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      messaging-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

  messaging-bootstrap:
    build: ./apps/api
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        uv run python -m src.openship.messaging.wait_for_broker
        && exec uv run python -m src.openship.messaging.cli bootstrap --apply
    environment:
      DATABASE_URL: postgresql://openship:openship@postgres:5432/openship
      NATS_SERVERS: nats://nats:4222
      NATS_AUTH_FILE: /run/nats-auth/operator.json
      NATS_TLS_CA_FILE:
    volumes:
      - "${OPENSHIP_MESSAGING_DIR:-.openship/messaging/dev}/operator.json:/run/nats-auth/operator.json:ro"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    restart: "no"

  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  artifactdata:
  natsdata:
