repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: Ruff Lint
        entry: bash -c "cd apps/agent && uv run ruff check ."
        language: system
        types: [python]
        pass_filenames: false
        files: ^apps/agent/

      - id: pytest
        name: Run Tests
        entry: bash -c "cd apps/agent && uv run pytest tests/ -q"
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: frontend-typecheck
        name: Vue Typecheck
        entry: bash -c "cd apps/web && pnpm typecheck"
        language: system
        pass_filenames: false
        always_run: true

      - id: frontend-tests
        name: Frontend Unit Tests
        entry: bash -c "cd apps/web && pnpm test:run"
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/nhtua/rayloc
    rev: v2026.10.4  # a release tag or commit SHA
    hooks:
      - id: rayloc-staged
