repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: Ruff Lint
        entry: bash -c "cd apps/agent && uv run ruff check ."
        language: system
        types: [python]
        pass_filenames: false
        files: ^apps/agent/

      - id: pytest
        name: Run Tests
        entry: bash -c "cd apps/agent && uv run pytest tests/ -q"
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      # The API's own validation, gated on the API changing so a frontend
      # commit never pays for it. The unit lane is the whole suite minus the
      # lanes that need a service or a live provider — the same lane CI runs.
      # Lint is deliberately not a gate here: apps/api has never been linted
      # and carries pre-existing findings across every rule family, so a lint
      # gate would be a separate, deliberate cleanup rather than something a
      # feature can quietly turn on.
      - id: api-tests
        name: API Unit Tests
        entry: bash -c "cd apps/api && uv run pytest -q -m 'not postgres and not provider_live'"
        language: system
        types: [python]
        pass_filenames: false
        files: ^apps/api/

      - id: frontend-typecheck
        name: Vue Typecheck
        entry: bash -c "cd apps/web && pnpm typecheck"
        language: system
        pass_filenames: false
        always_run: true

      - id: frontend-tests
        name: Frontend Unit Tests
        entry: bash -c "cd apps/web && pnpm test:run"
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/nhtua/rayloc
    rev: v2026.10.4  # a release tag or commit SHA
    hooks:
      - id: rayloc-staged
