events {}
http {
    # Operator-provisioned case-sensitive map: "~^<hex API key>$" 1;
    map $http_open_sandbox_api_key $sandbox_authorized {
        default 0;
        include /etc/opensandbox/auth.map;
    }
    map $http_upgrade $sandbox_connection {
        default upgrade;
        '' close;
    }
    server {
        listen 8080;
        server_tokens off;
        access_log off;
        client_max_body_size 17m;
        if ($sandbox_authorized = 0) { return 403; }
        location / {
            proxy_pass http://opensandbox-server:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $sandbox_connection;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 130s;
        }
    }
}
