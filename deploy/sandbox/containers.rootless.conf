# Install as ~/.config/containers/containers.conf.d/90-openship-sandbox.conf.
# Requires Podman with engine.runtimes_flags support (see its containers.conf).
[engine]
runtime = "runc"

[engine.runtimes]
runsc = ["/usr/bin/runsc"]

# Runtime flags have no leading --. The runtimes table above contains paths.
# This affects runsc only; ordinary containers continue to use runc.
# Rootless development only: qualify resource enforcement independently before
# enabling generated-code execution; runsc will not manage cgroups itself.
[engine.runtimes_flags]
runsc = ["ignore-cgroups"]
